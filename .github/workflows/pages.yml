name: Publish site

# Everything on main has been approved in the private review queue, so the
# site is simply a build of main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r site/requirements.txt
      - name: Build
        run: |
          python site/build.py --out _site --refs HEAD \
            --site-url "${{ vars.SITE_URL || 'https://hub.huntbase.io' }}" \
            --run-url-template "${{ vars.RUN_URL_TEMPLATE || 'https://huntbase.io/request-access?hunt={slug}' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
