# gitleaks configuration: the default ruleset plus narrow allowlists for
# known false positives. Keep every entry specific to a path and a value
# shape, and say why it is safe.
[extend]
useDefault = true

[[allowlists]]
# Generated pages load static/analytics.js with the PostHog *project* key
# (phc_...). PostHog project keys are public, write-only ingestion keys
# meant to ship in browser code.
description = "Public PostHog project key in the analytics script tag"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''\.html$''']
regexTarget = "line"
regexes = ['''<script defer src="(https://hub\.huntbase\.io/|\./|(\.\./)*)static/analytics\.js" data-key="phc_[A-Za-z0-9]+"''']

[[allowlists]]
# Threat indicators: Power BI "publish to web" report URLs used as phishing
# lures (app.powerbi.com/view?r=eyJrIjoi...). The r= value is base64 JSON
# that looks like a Grafana key; it is an attacker IOC, not our credential.
description = "Power BI publish-to-web lure URLs recorded as IOCs"
targetRules = ["grafana-api-key"]
regexTarget = "line"
regexes = ['''app\.powerbi\.com/view\?r=eyJrIjoi[A-Za-z0-9+/=_-]+''']
